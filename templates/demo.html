<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo control - Water monitor</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header class="top"><h1>Demo control</h1><nav><a href="{{ url_for('municipality') }}">Back to overview</a><a href="{{ url_for('logout') }}">Sign out</a></nav></header>
<main>
<p>Choose what each simulated house reports. The municipality overview and that house owner's page change within a few seconds.</p>
<p><button class="primary" id="reset">Reset all to normal</button></p>
<div class="panel"><table><thead><tr><th>House</th><th>Scenario</th><th>Dashboards show</th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="msg" role="status" aria-live="polite"><b></b></p>
<p class="hint" id="note"></p>
<p class="hint" id="info"></p>
</main>
<script>
const SC=[["normal","Normal"],["leak","Leak"],["no_supply","No supply"]];
const LABEL={normal:"Normal",possible_leak:"Possible leak",no_supply:"No water"};
function say(t){document.getElementById("msg").textContent=t;}
async function post(url,body){          // returns null when the server accepted it, else a short reason
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    return r.ok?null:"server answered "+r.status;
  }catch(e){return "no connection";}
}
async function render(){
  let s,live={};
  try{
    s=await (await fetch("/api/demo/state")).json();
    const o=await fetch("/api/municipality/houses");
    if(o.ok){(await o.json()).houses.forEach(h=>{live[h.house_id]=h;});}
  }catch(e){document.getElementById("note").textContent="Connection problem, retrying...";return;}
  document.getElementById("note").textContent="Live. Last updated "+new Date().toLocaleTimeString();
  const body=document.getElementById("rows");body.innerHTML="";
  Object.keys(s).forEach(id=>{
    const tr=document.createElement("tr");const td=document.createElement("td");td.textContent="House "+id;tr.appendChild(td);
    const tb=document.createElement("td");
    SC.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.style.marginRight="6px";
      b.setAttribute("aria-pressed",s[id]===k);
      b.onclick=async()=>{const err=await post("/api/demo/set",{house_id:+id,scenario:k});
        say(err?"NOT saved for House "+id+" ("+err+")":"Saved: House "+id+" set to "+l+". It shows on the dashboards within a few seconds.");render();};
      tb.appendChild(b);});
    tr.appendChild(tb);
    const ts=document.createElement("td");const h=live[id];
    ts.textContent=!h?"-":(h.node_online?LABEL[h.status]+(h.status!=="normal"?" ("+h.elapsed+" "+h.unit+")":""):"Sensor offline");
    tr.appendChild(ts);body.appendChild(tr);});
}
document.getElementById("reset").onclick=async()=>{const err=await post("/api/demo/reset");
  say(err?"Reset NOT saved ("+err+")":"Saved: all houses reset to Normal.");render();};
async function info(){
  try{const d=await (await fetch("/version")).json();
    document.getElementById("info").textContent="Build "+d.build+" | "+d.sim_mode+" mode | server process "+d.pid+" | running "+Math.floor(d.uptime/60)+" min "+(d.uptime%60)+" s";}catch(e){}
}
info();setInterval(info,5000);
render();setInterval(render,5000);
</script></body></html>
